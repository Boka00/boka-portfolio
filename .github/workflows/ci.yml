name: CI Security & Build Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, Audit, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Clean deterministic install
        run: npm ci --ignore-scripts

      - name: Security vulnerability audit (High/Critical)
        run: npm audit --audit-level=high

      - name: Lint check
        run: npm run lint

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: Production Vite build
        run: npm run build

