    <!-- Zero-FOUC Theme Initialization (Dark by default, respects saved preference & system changes) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('boka-portfolio-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          var meta = document.getElementById('meta-theme-color');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0A0A0F' : '#F8FAFC');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-violet-500/30 selection:text-violet-950 dark:bg-[#0A0A0F] dark:text-slate-100 dark:selection:bg-violet-500/30 dark:selection:text-cyan-200">
